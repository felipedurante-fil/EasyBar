name: Linux

on:
  push:
    paths: ["linux/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["linux/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

jobs:
  build:
    # 22.04 = mesma base do Linux Mint 21; o binário também roda no Mint 22.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Testes (lógica pura)
        run: cargo test -p easybar-core --locked
      - name: Compilar
        run: cargo build --release -p easybar --locked
      - name: Empacotar
        run: |
          mkdir -p dist/easybar-linux-x86_64
          cp target/release/easybar dist/easybar-linux-x86_64/
          cp assets/easybar.png assets/easybar.desktop install-binary.sh dist/easybar-linux-x86_64/ 2>/dev/null || true
          tar -C dist -czf easybar-linux-x86_64.tar.gz easybar-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: easybar-linux-x86_64
          path: linux/easybar-linux-x86_64.tar.gz
